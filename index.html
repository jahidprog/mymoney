<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>My Money</title>
<style>
:root{--bg:#EEF2F0;--sf:#fff;--ink:#14231F;--mu:#5B6B66;--ln:#D5DDD9;--pr:#0E6B57;--ex:#B4373A;--ld:#A86A0C;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0D1412;--sf:#16201D;--ink:#E4EEEA;--mu:#8FA29B;--ln:#25322E;--pr:#3FBF9F;--ex:#F07A7D;--ld:#E3A94B;--on:#06201A}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;padding-top:10px;min-height:44px}
.bar span{font-size:13px;color:var(--ld)}
.bar button{width:44px;height:44px;font-size:20px;color:var(--mu);border-radius:12px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 0 6px}
.nav button{font-size:22px;width:44px;height:44px;border-radius:12px;color:var(--mu)}
.nav b{font-size:15px;font-weight:600}
.bal{padding:8px 0 18px}
.bal small,.k{color:var(--mu);font-size:13px}
.bal strong{display:block;font-size:46px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.grid div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.grid b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
h2{font-size:15px;font-weight:600;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{color:var(--mu);font-weight:500;font-size:14px}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--ln)}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{color:var(--mu);font-size:13px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--pr)}.out{color:var(--ex)}.ld{color:var(--ld)}
.row .m span.late{color:var(--ex);font-weight:600}
.act{border:1px solid var(--pr);color:var(--pr);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.x{color:var(--mu);width:32px;height:32px;font-size:18px}
.empty{padding:16px 14px;color:var(--mu);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chips button{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chips button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));background:var(--pr);color:var(--on);border-radius:28px;padding:0 22px;height:56px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
.shade.open{display:flex}
.sheet{background:var(--sf);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet p{color:var(--mu);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{padding:9px 0;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
#amt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
label.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px;color:var(--ink)}
.chk input{width:22px;height:22px}
.save{width:100%;margin-top:18px;height:52px;border-radius:14px;background:var(--pr);color:var(--on);font-weight:700}
.save.ghost{background:none;color:var(--mu);margin-top:4px;height:44px}
.save:disabled{opacity:.5}
.err{color:var(--ex);font-size:14px;margin-top:10px;min-height:20px}
.link{display:block;margin:28px auto 0;color:var(--mu);font-size:13px;text-decoration:underline}
#toast{position:fixed;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="bar"><span id="sync"></span><button id="rf" aria-label="Refresh">&#8635;</button></div>
<div class="nav"><button id="pv" aria-label="Previous month">&lsaquo;</button><b id="mon"></b><button id="nx" aria-label="Next month">&rsaquo;</button></div>
<div class="bal"><small>Cash in hand</small><strong id="bal">&#2547;0</strong></div>
<div class="grid">
  <div><span class="k">In</span><b id="mi" class="in"></b></div>
  <div><span class="k">Out</span><b id="mo" class="out"></b></div>
  <div><span class="k">Study support</span><b id="ms" class="in"></b></div>
</div>

<h2>Owed to me <span id="owt"></span></h2><div class="list" id="owed"></div>
<h2>Business bills due <span id="dut"></span></h2><div class="list" id="due"></div>
<h2>This month</h2>
<div class="chips" id="chips"></div>
<div class="list" id="hist"></div>
<button class="link" id="conn">Connection settings</button>

<button class="fab" id="add">+ Add</button>

<div class="shade" id="shade"><div class="sheet">
  <div class="seg" id="seg"></div>
  <label for="amt">Amount (&#2547;)</label><input id="amt" inputmode="decimal" placeholder="0">
  <label for="cat" id="catl">Category</label><select id="cat"></select>
  <div id="pw"><label for="party" id="pl">From</label><input id="party" autocomplete="off"></div>
  <label for="date">Date</label><input id="date" type="date">
  <label for="note">Note (optional)</label><input id="note" autocomplete="off">
  <div id="bz" hidden>
    <label class="chk"><input type="checkbox" id="unpaid" checked> Not paid yet, remind me</label>
    <div id="dw"><label for="dueD">Pay by</label><input id="dueD" type="date"></div>
  </div>
  <button class="save" id="save">Save</button>
  <button class="save ghost" id="cancel">Cancel</button>
</div></div>

<div class="shade" id="setup"><div class="sheet">
  <h3>Connect your sheet</h3>
  <p>Paste the web app URL and the secret key from your Apps Script. They stay on this phone only.</p>
  <label for="url">Web app URL</label><input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
  <label for="key">Secret key</label><input id="key" type="password" autocomplete="off">
  <div class="err" id="serr"></div>
  <button class="save" id="conn-save">Connect</button>
  <button class="save ghost" id="conn-cancel">Cancel</button>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS=localStorage;
const get=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}};
const set=(k,v)=>LS.setItem(k,JSON.stringify(v));
const fmt=n=>'\u09F3'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const rid=()=>(Math.random().toString(16)+'00000000').slice(2,10);
const TYPES={Income:'Income',Expense:'Expense',Lend:'Lend',Family:'Study',Business:'Business'};
const CATS={
  Income:['Salary','Freelance','Gift','Other'],
  Expense:['Food','Transport','Rent','Bills','Phone/Internet','Shopping','Health','Education','Other'],
  Lend:['Loan'],
  Family:['Tuition & fees','Living costs','Other'],
  Business:['Hosting/Domain','Software/Tools','Ads','Equipment','Freelancer','Tax','Other']};
const PARTY={Income:'Source',Lend:'Lent to',Family:'From',Business:'Paid to'};
let S=get('cache',[]),Q=get('q',[]),M=iso(new Date()).slice(0,7),T='Expense',F='all',busy=false;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3800)}

async function api(action,args){
  let j;
  try{
    const r=await fetch(get('url',''),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:get('key',''),action,args})});
    j=await r.json();
  }catch(e){throw new Error('NET')}
  if(!j.ok)throw new Error(j.error||'Server error');
  if(j.warn)toast(j.warn);
  S=j.data;set('cache',S);
  return S;
}

// Server rows plus entries still waiting to sync
function all(){return S.concat(Q.map(e=>({id:e.id,date:e.date,type:e.type,cat:e.cat,amt:e.amt,party:e.party,note:e.note,
  status:e.type=='Lend'?'Open':e.type=='Business'?(e.due?'Due':'Paid'):'',due:e.due||'',pending:1})))}

function needSetup(msg){$('#serr').textContent=msg||'';$('#setup').classList.add('open')}

async function flush(){
  if(busy)return;
  if(!get('url','')||!get('key','')){needSetup();return}
  busy=true;$('#sync').textContent='Syncing...';
  try{
    while(Q.length){await api('addEntry',Q[0]);Q.shift();set('q',Q);render()}
    await api('getAll');
    $('#sync').textContent='';
  }catch(e){
    if(e.message=='Wrong key')needSetup('That key does not match. Enter it again.');
    $('#sync').textContent=e.message=='NET'?(Q.length?Q.length+' waiting to sync':'Offline'):e.message;
  }
  busy=false;render();
}

async function act(fn,arg){
  try{await api(fn,arg);render()}
  catch(e){toast(e.message=='NET'?'You are offline. Try again when connected.':e.message)}
}

function row(r,right,mid,cls){
  const sign=(r.type=='Income'||r.type=='Family')?'in':r.type=='Lend'?'ld':'out';
  return `<div class="row"><div class="m"><b>${esc(r.party||r.cat)}</b><span class="${cls||''}">${esc(mid)}</span></div>
  <span class="amt ${sign}">${sign=='in'?'+':'-'}${fmt(r.amt)}</span>${right}</div>`}
const doneBtn=(r,t)=>r.pending?'':`<button class="act" data-done="${r.id}">${t}</button>`;

function render(){
  const D=all(),today=iso(new Date());
  let i=0,o=0,s=0,cash=0;
  D.forEach(r=>{
    if(r.type=='Income'||r.type=='Family')cash+=r.amt;
    else if(r.type=='Expense')cash-=r.amt;
    else if(r.type=='Business'&&r.status!='Due')cash-=r.amt;
    else if(r.type=='Lend'&&r.status=='Open')cash-=r.amt;
    if(r.date.slice(0,7)!=M)return;
    if(r.type=='Income')i+=r.amt;
    else if(r.type=='Family'){i+=r.amt;s+=r.amt}
    else if(r.type=='Expense'||(r.type=='Business'&&r.status!='Due'))o+=r.amt});
  $('#bal').textContent=fmt(cash);
  $('#mi').textContent=fmt(i);$('#mo').textContent=fmt(o);$('#ms').textContent=fmt(s);
  $('#mon').textContent=new Date(M+'-15').toLocaleString('en',{month:'long',year:'numeric'});

  const owed=D.filter(r=>r.type=='Lend'&&r.status=='Open');
  $('#owt').textContent=owed.length?fmt(owed.reduce((a,r)=>a+r.amt,0)):'';
  $('#owed').innerHTML=owed.length?owed.map(r=>row(r,doneBtn(r,'Got it back'),'Lent '+r.date+(r.note?' - '+r.note:''))).join(''):'<div class="empty">Nobody owes you money.</div>';

  const due=D.filter(r=>r.type=='Business'&&r.status=='Due').sort((a,b)=>a.due<b.due?-1:1);
  $('#dut').textContent=due.length?fmt(due.reduce((a,r)=>a+r.amt,0)):'';
  $('#due').innerHTML=due.length?due.map(r=>{const late=r.due<today;
    return row(r,doneBtn(r,'Mark paid'),(late?'Overdue ':'Due ')+r.due+' - '+r.cat,late?'late':'')}).join(''):'<div class="empty">No bills waiting. Add a business expense and tick "Not paid yet" to get a reminder.</div>';

  $('#chips').innerHTML=['all',...Object.keys(TYPES)].map(k=>`<button data-f="${k}" class="${F==k?'on':''}">${k=='all'?'All':TYPES[k]}</button>`).join('');
  const h=D.filter(r=>r.date.slice(0,7)==M&&r.status!='Due'&&(F=='all'||r.type==F)).sort((a,b)=>a.date<b.date?1:-1);
  $('#hist').innerHTML=h.length?h.map(r=>row(r,`<button class="x" data-del="${r.id}" aria-label="Delete">&times;</button>`,
    r.date+' - '+TYPES[r.type]+(r.party&&r.cat?' - '+r.cat:'')+(r.status=='Repaid'?' (repaid)':'')+(r.note?' - '+r.note:'')+(r.pending?' (not synced)':''))).join(''):'<div class="empty">Nothing here yet. Tap + Add.</div>';
}

function shift(n){const d=new Date(M+'-15');d.setMonth(d.getMonth()+n);M=iso(d).slice(0,7);render()}
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);
$('#rf').onclick=flush;
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f){F=b.dataset.f;render()}
  if(b.dataset.done){b.disabled=true;act('markDone',b.dataset.done)}
  if(b.dataset.del&&confirm('Delete this entry?')){
    const qi=Q.findIndex(x=>x.id==b.dataset.del);
    if(qi>=0){Q.splice(qi,1);set('q',Q);render()}else act('deleteEntry',b.dataset.del)}
});

// add sheet
function buildForm(){
  $('#seg').innerHTML=Object.keys(TYPES).map(k=>`<button data-t="${k}" class="${T==k?'on':''}">${TYPES[k]}</button>`).join('');
  $('#cat').innerHTML=CATS[T].map(c=>`<option>${c}</option>`).join('');
  $('#catl').hidden=$('#cat').hidden=T=='Lend';
  $('#pw').hidden=T=='Expense';$('#pl').textContent=PARTY[T]||'';
  $('#bz').hidden=T!='Business';$('#dw').hidden=!$('#unpaid').checked;
}
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b){T=b.dataset.t;buildForm()}};
$('#unpaid').onchange=buildForm;
$('#add').onclick=()=>{
  $('#amt').value='';$('#party').value='';$('#note').value='';
  $('#date').value=iso(new Date());$('#unpaid').checked=true;
  const d=new Date();d.setDate(d.getDate()+7);$('#dueD').value=iso(d);
  buildForm();$('#shade').classList.add('open');$('#amt').focus();
};
const close=()=>$('#shade').classList.remove('open');
$('#cancel').onclick=close;
$('#shade').onclick=e=>{if(e.target.id=='shade')close()};
$('#save').onclick=()=>{
  const amt=parseFloat($('#amt').value);
  if(!(amt>0))return toast('Enter an amount above 0.');
  const party=$('#party').value.trim();
  if((T=='Lend'||T=='Family')&&!party)return toast(T=='Lend'?'Enter who you lent to.':'Enter who it is from.');
  const unpaid=T=='Business'&&$('#unpaid').checked;
  if(unpaid&&!$('#dueD').value)return toast('Pick a pay-by date.');
  Q.push({id:rid(),type:T,amt,cat:T=='Lend'?'Loan':$('#cat').value,party:T=='Expense'?'':party,
    date:$('#date').value||iso(new Date()),note:$('#note').value.trim(),due:unpaid?$('#dueD').value:''});
  set('q',Q);close();render();flush();
};

// connection settings
$('#conn').onclick=()=>{$('#url').value=get('url','');$('#key').value='';needSetup('')};
$('#conn-cancel').onclick=()=>$('#setup').classList.remove('open');
$('#conn-save').onclick=async()=>{
  const url=$('#url').value.trim(),key=$('#key').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url))return $('#serr').textContent='The URL should look like https://script.google.com/macros/s/.../exec';
  if(!key)return $('#serr').textContent='Enter your secret key.';
  set('url',url);set('key',key);
  const b=$('#conn-save');b.disabled=true;b.textContent='Connecting...';$('#serr').textContent='';
  try{await api('getAll');$('#setup').classList.remove('open');render();flush()}
  catch(e){$('#serr').textContent=e.message=='NET'?'Could not reach the script. Check the URL and that access is set to "Anyone".':e.message=='Wrong key'?'That key does not match the one in Code.gs.':e.message}
  b.disabled=false;b.textContent='Connect';
};

window.addEventListener('online',flush);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)flush()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();flush();
</script>
</body>
</html>
